[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codex-time"
version = "0.1.0"
description = "Read-only Codex session work-time tracker for Linux"
requires-python = ">=3.12"
dependencies = [
    "websockets>=15,<17",
    "pydantic>=2.10,<3",
    "rich>=14,<15",
]

[project.scripts]
codex-time = "codex_time.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "mypy>=1.13", "ruff>=0.9"]

[tool.hatch.build.targets.wheel]
packages = ["src/codex_time"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
